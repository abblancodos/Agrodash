# .gitea/workflows/deploy.yml

name: Deploy

on:
  push:
    branches: [main]

jobs:

  # ── Detectar qué cambió ──────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - '*.json'
              - '*.js'
              - '*.ts'
              - '!src/rust/**'
            backend:
              - 'src/rust/**'

  # ── Lint + check de tipos (siempre, en paralelo con changes) ─────────────────
  # No bloquea el deploy si solo cambió frontend o solo backend,
  # pero sí bloquea si el job correspondiente falla.
  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: svelte-check
        run: npx svelte-check --tsconfig ./tsconfig.json

  lint-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: rust-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: rust-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: rustfmt
        working-directory: src/rust
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: src/rust
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Tests backend ─────────────────────────────────────────────────────────────
  test-backend:
    needs: lint-backend
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: rust-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: rust-

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        working-directory: src/rust
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cargo test --workspace -- --nocapture

  # ── Deploy frontend ───────────────────────────────────────────────────────────
  deploy-frontend:
    needs: lint-frontend
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend
        run: |
          docker rm -f agrodash-web-tmp 2>/dev/null || true
          docker run -d --name agrodash-web-tmp \
            -v /home/embebidos/.server-lab/agrodash/web:/output \
            alpine sleep 30
          docker cp build/. agrodash-web-tmp:/output/
          docker rm -f agrodash-web-tmp

  # ── Deploy backend ────────────────────────────────────────────────────────────
  deploy-backend:
    needs: test-backend
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: rust-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: rust-

      - uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        uses: actions/cache@v4
        id: sqlx-cache
        with:
          path: ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ hashFiles('src/rust/Cargo.lock') }}

      - name: Build sqlx-cli if not cached
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: sqlx prepare
        working-directory: src/rust/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cargo sqlx prepare

      - name: Commit sqlx cache
        run: |
          git config user.email "ci@agrodash"
          git config user.name "CI Bot"
          git add src/rust/api/.sqlx
          git diff --cached --quiet || git commit -m "chore: update sqlx cache [skip ci]"
          git push --force-with-lease

      - name: Build release binaries
        working-directory: src/rust
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cargo build --release

      - name: Deploy API binary
        run: |
          docker rm -f agrodash-api-tmp 2>/dev/null || true
          docker run -d --name agrodash-api-tmp \
            -v /home/embebidos/.server-lab/agrodash/api:/output \
            alpine sleep 30
          docker cp src/rust/target/release/agrodash-api agrodash-api-tmp:/output/
          docker rm -f agrodash-api-tmp

      - name: Deploy Agent binary
        run: |
          docker rm -f agrodash-agent-tmp 2>/dev/null || true
          docker run -d --name agrodash-agent-tmp \
            -v /home/embebidos/.server-lab/agrodash/api:/output \
            alpine sleep 30
          docker cp src/rust/target/release/agrodash-agent agrodash-agent-tmp:/output/
          docker rm -f agrodash-agent-tmp

      - name: Restart API container
        run: |
          docker kill --signal=SIGTERM server-lab-api-rust-agrodash-1 2>/dev/null || true
          sleep 6
          docker restart server-lab-api-rust-agrodash-1
